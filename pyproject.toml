[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti-navigation"
version = "0.2.0"
description = "Autonomous UGV navigation with Perception AI, Visual SLAM, and rough-terrain planning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.10,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drishti = ["models/*.npz", "models/*.json"]
